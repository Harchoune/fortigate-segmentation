# =============================================================================
# FortiGate — extrait de configuration MODÈLE (anonymisé, non exporté d'un équipement réel)
# -----------------------------------------------------------------------------
# Illustre la segmentation décrite dans matrice_flux.md : objets d'adresse par zone,
# groupes de services, et quelques politiques inter-zones en moindre privilège.
#
# ⚠️ Modèle à adapter : interfaces, adresses et services doivent correspondre au
#    matériel réel. Un export réel (`show`) doit être ANONYMISÉ avant commit :
#    IP publiques, mots de passe, secrets VPN, certificats → masqués.
#    Voir captures/TODO-PREUVE_config.md.
# =============================================================================

# ---- Objets d'adresse (un par zone) ----
config firewall address
    edit "net-LAN"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "net-DMZ"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "net-SERVERS"
        set subnet 192.168.30.0 255.255.255.0
    next
    edit "net-ADMIN"
        set subnet 192.168.40.0 255.255.255.0
    next
    edit "srv-web-DMZ"
        set subnet 192.168.20.10 255.255.255.255
    next
    edit "srv-db-SERVERS"
        set subnet 192.168.30.10 255.255.255.255
    next
end

# ---- Groupes de services ----
config firewall service group
    edit "svc-web"
        set member "HTTP" "HTTPS"
    next
    edit "svc-admin"
        set member "SSH" "RDP" "HTTPS"
    next
end

# ---- Politiques (moindre privilège, journalisées) ----
# Règle 2 : LAN -> DMZ en HTTPS
config firewall policy
    edit 0
        set name "LAN-to-DMZ-https"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "net-LAN"
        set dstaddr "srv-web-DMZ"
        set service "HTTPS"
        set action accept
        set schedule "always"
        set logtraffic all
    next
    # Règle 4 : DMZ (web) -> SERVERS (base) sur un port back-end précis
    edit 0
        set name "DMZweb-to-DBserver"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "srv-web-DMZ"
        set dstaddr "srv-db-SERVERS"
        set service "PostgreSQL"
        set action accept
        set schedule "always"
        set logtraffic all
    next
    # Règle 7 : WAN -> DMZ (publication web)
    edit 0
        set name "WAN-to-DMZ-web"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "srv-web-DMZ"
        set service "HTTPS"
        set action accept
        set schedule "always"
        set logtraffic all
        # set ips-sensor "protect_web" ; set utm-status enable  (si licence)
    next
    # Règle 9 : ADMIN -> toutes zones, services d'administration
    edit 0
        set name "ADMIN-to-all-mgmt"
        set srcintf "port5"
        set dstintf "port2" "port3" "port4"
        set srcaddr "net-ADMIN"
        set dstaddr "net-LAN" "net-DMZ" "net-SERVERS"
        set service "svc-admin"
        set action accept
        set schedule "always"
        set logtraffic all
    next
end

# ---- Deny implicite ----
# FortiGate refuse par défaut tout flux non autorisé ci-dessus.
# Pour journaliser ces refus, activer la journalisation du trafic refusé :
#   config system settings
#       set fwpolicy-implicit-log enable
#   end
